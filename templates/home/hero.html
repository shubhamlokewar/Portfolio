<!-- =========================================
     HERO SECTION
========================================= -->

<section id="home" class="hero">

    <div class="container hero__container">

        <!-- =====================================
             LEFT — HERO CONTENT
        ====================================== -->

        <div class="hero__content">

            <!-- EYEBROW -->

            <p class="hero__eyebrow">
                Welcome to my portfolio
            </p>


            <!-- TITLE -->

            <h1 class="hero__title">

                Hi, I'm

                <span class="hero__name">
                    Shubham
                </span>

            </h1>


            <!-- ANIMATED ROLE -->

            <h2 class="hero__role">

                <span id="role-text">
                    Python Developer | Data Analyst
                </span>

            </h2>


            <!-- DESCRIPTION -->

            <p class="hero__description">
                I build modern, reliable and user-focused
                digital experiences with clean code,
                thoughtful design and continuous learning.
            </p>


            <!-- =====================================
                 HERO ACTIONS
            ====================================== -->

            <div class="hero__actions">

                <a
                    href="#projects"
                    class="btn btn--primary"
                >
                    View My Work
                    <span>→</span>
                </a>


                <a
                    href="/media/resume/resume.pdf"
                    class="btn btn--secondary"
                    download
                >
                    Download Resume
                    <span>↓</span>
                </a>

            </div>


            <!-- =====================================
                 SOCIAL ICONS
            ====================================== -->

            <div class="hero__socials">

                <!-- LinkedIn -->

                <a
                    href="https://www.linkedin.com/in/shubhamlokewar"
                    class="hero__social-link"
                    aria-label="LinkedIn"
                    title="LinkedIn"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <i class="fa-brands fa-linkedin-in"></i>
                </a>


                <!-- GitHub -->

                <a
                    href="https://github.com/shubhamlokewar"
                    class="hero__social-link"
                    aria-label="GitHub"
                    title="GitHub"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <i class="fa-brands fa-github"></i>
                </a>


                <!-- Dev.to -->

                <a
                    href="https://dev.to/shubhamlokewar"
                    class="hero__social-link"
                    aria-label="Dev.to"
                    title="Dev.to"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <i class="fa-brands fa-dev"></i>
                </a>


                <!-- Email -->

                <a
                    href="mailto:shubhamlokewarr@gmail.com"
                    class="hero__social-link"
                    aria-label="Email"
                    title="Email"
                >
                    <i class="fa-solid fa-envelope"></i>
                </a>

            </div>

        </div>


        <!-- =====================================
             RIGHT — PROFILE IMAGE
        ====================================== -->

        <div class="hero__visual">

            <div class="hero__image-glow"></div>

            <img
                src="/media/profile/Profile.png"
                alt="Shubham Lokewar"
                class="hero__person-image"
            >

        </div>

    </div>


    <!-- =========================================
         SCROLL DOWN
    ========================================== -->

    <a
        href="#about"
        class="hero__scroll"
        aria-label="Scroll to About"
    >

        <span>
            Scroll Down
        </span>

        <span class="hero__scroll-arrow">
            ↓
        </span>

    </a>

</section>
