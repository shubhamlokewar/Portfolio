<header class="navbar">

    <div class="container navbar__container">

        <!-- =========================================
             BRAND
        ========================================== -->

        <a
            href="{% url 'core:home' %}"
            class="brand"
            aria-label="Go to homepage"
        >

            <span class="brand__name">
                shubhamlokewar
            </span>

            <span class="brand__portfolio">
                Portfolio<span>.</span>
            </span>

        </a>


        <!-- =========================================
             MOBILE MENU BUTTON
        ========================================== -->

        <button
            type="button"
            class="navbar__toggle"
            id="navbar-toggle"
            aria-label="Toggle navigation"
            aria-expanded="false"
            aria-controls="navbar-menu"
        >

            <span></span>
            <span></span>
            <span></span>

        </button>


        <!-- =========================================
             NAVIGATION AREA
        ========================================== -->

        <div
            class="navbar__right"
            id="navbar-menu"
        >

            <!-- NAVIGATION -->

            <nav
                class="navbar__menu"
                aria-label="Main navigation"
            >

                <a
                    href="{% url 'core:home' %}#home"
                >
                    Home
                </a>

                <a
                    href="{% url 'core:home' %}#about"
                >
                    About
                </a>

                <a
                    href="{% url 'core:home' %}#skills"
                >
                    Skills
                </a>

                <a
                    href="{% url 'core:home' %}#projects"
                >
                    Projects
                </a>

                <a
                    href="{% url 'core:home' %}#experience"
                >
                    Experience
                </a>

                <a
                    href="{% url 'contact:contact' %}"
                >
                    Contact
                </a>

            </nav>


            <!-- =========================================
                 THEME TOGGLE
            ========================================== -->

            <button
                type="button"
                class="theme-toggle"
                id="theme-toggle"
                aria-label="Toggle dark mode"
                title="Toggle theme"
            >

                <span class="theme-toggle__track">

                    <span
                        class="theme-toggle__icon theme-toggle__moon"
                        aria-hidden="true"
                    >
                        ☾
                    </span>

                    <span
                        class="theme-toggle__icon theme-toggle__sun"
                        aria-hidden="true"
                    >
                        ☀
                    </span>

                    <span
                        class="theme-toggle__thumb"
                        aria-hidden="true"
                    ></span>

                </span>

            </button>

        </div>

    </div>

</header>
