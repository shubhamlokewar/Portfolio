{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Personal portfolio website"
    >

    <title>
        {% block title %}
            Portfolio
        {% endblock %}
    </title>


    <!-- =========================================
         GOOGLE FONTS
    ========================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =========================================
         APPLY SAVED THEME BEFORE PAGE RENDERS
    ========================================== -->

    <script>
        (function () {

            const savedTheme =
                localStorage.getItem("portfolio-theme");

            const theme =
                savedTheme === "dark"
                    ? "dark"
                    : "light";

            document.documentElement.setAttribute(
                "data-theme",
                theme
            );

        })();
    </script>


   <!-- =========================================
     STYLES
========================================= -->

<link
    rel="stylesheet"
    href="{% static 'css/main.css' %}"
>

<link
    rel="stylesheet"
    href="{% static 'css/navbar.css' %}"
>

<link
    rel="stylesheet"
    href="{% static 'css/hero.css' %}"
>

<link
    rel="stylesheet"
    href="{% static 'css/about.css' %}"
>

<link
    rel="stylesheet"
    href="{% static 'css/skills.css' %}"
>

<link
    rel="stylesheet"
    href="{% static 'css/projects.css' %}"
>

<link
    rel="stylesheet"
    href="{% static 'css/experience.css' %}"
>

<link
    rel="stylesheet"
    href="{% static 'css/contact.css' %}"
>

<link
    rel="stylesheet"
    href="{% static 'css/footer.css' %}"
>

<link
    rel="stylesheet"
    href="{% static 'css/creative-theme.css' %}"
>

<link
    rel="stylesheet"
    href="{% static 'css/animations.css' %}"
>

<link
    rel="stylesheet"
    href="{% static 'css/responsive.css' %}"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
>

{% block extra_css %}
{% endblock %}

</head>


<body>

    {% include "navbar.html" %}


    <main id="main-content">

        {% block content %}
        {% endblock %}

    </main>


    {% include "footer.html" %}


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script
        src="{% static 'js/main.js' %}"
    ></script>

    <script
        src="{% static 'js/navbar.js' %}"
    ></script>

    <script
        src="{% static 'js/animations.js' %}"
    ></script>

    <script
        src="{% static 'js/gallery.js' %}"
    ></script>

    <!-- Theme must load after DOM exists -->
    <script
        src="{% static 'js/theme.js' %}"
    ></script>


    {% block extra_js %}
    {% endblock %}

</body>

</html>
